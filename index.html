/* Resmi 2026 KPSS sınav tarihleri (ÖSYM takvimi) — yalnız gerçek tarihe göre
   canlı geri sayım için, hiçbir sahte/azalan sayaç yok. */
const KPSS_EXAM_DATES_UTC = [
  Date.UTC(2026, 8, 6),  // 6 Eylül 2026 — Lisans B / Öğretmenlik
  Date.UTC(2026, 8, 12), // 12 Eylül 2026 — Lisans A
  Date.UTC(2026, 9, 4),  // 4 Ekim 2026 — Ön Lisans
  Date.UTC(2026, 9, 25), // 25 Ekim 2026 — Ortaöğretim
];

function useSoonestExamCountdown() {
  const [days, setDays] = useState(null);
  useEffect(() => {
    const now = Date.now();
    const future = KPSS_EXAM_DATES_UTC.filter((d) => d > now);
    if (!future.length) { setDays(null); return; }
    setDays(Math.ceil((Math.min(...future) - now) / 86400000));
  }, []);
  return days;
}

const CompassRing = ({size=280, opacity=.18}) => (

    <defs>

    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#ring-grad)" strokeWidth=".3" strokeDasharray="2 4"/>
    {Array.from({length:24}).map((_,i) => {
      const a = (i/24)*2*Math.PI;
      const x1 = 100 + Math.cos(a)*88, y1 = 100 + Math.sin(a)*88;
      const x2 = 100 + Math.cos(a)*(i%6===0?78:84), y2 = 100 + Math.sin(a)*(i%6===0?78:84);
      return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#D4A857" strokeWidth={i%6===0?1:.4} opacity=".6"/>;

    {name:'Türkçe', correct:26, wrong:4, color:'#F5C76E'},
    {name:'Matematik', correct:18, wrong:9, color:'#D4A857'},
    {name:'Tarih', correct:21, wrong:6, color:'#B8893F'},
    {name:'Coğrafya', correct:14, wrong:8, color:'#A06A2D'},
    {name:'Vatandaşlık', correct:22, wrong:3, color:'#E8B86F'},
  ];
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div>
          <div style={{fontSize:9,color:'#D4A857',fontWeight:700,letterSpacing:'.14em'}}>GENEL DENEME #14</div>
          <div style={{fontSize:9,color:'#5A6178', marginTop:2}}>Genel Yetenek + Genel Kültür</div>
        </div>
        <div style={{background:'rgba(212,168,87,.15)',border:'1px solid rgba(212,168,87,.35)',borderRadius:8,padding:'4px 12px',display:'flex',gap:8,alignItems:'baseline'}}>
          <span style={{fontFamily:'Instrument Serif', fontSize:18, color:'#F5C76E', lineHeight:1}}>≈78.4</span>
          <span style={{fontSize:9,color:'#8B92A8'}}>Puan tahmini</span>
        </div>
      </div>
      {branches.map((b,i) => {
        const net = b.correct - b.wrong/4;
        const pct = Math.round((b.correct/(b.correct+b.wrong))*100);
        return (
          <div key={i} style={{marginBottom:8}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
              <span style={{fontSize:10.5,color:'#8B92A8'}}>{b.name}</span>
              <span style={{fontSize:10.5,color:b.color,fontWeight:600}}>+{net.toFixed(2)} net</span>
            </div>
            <div style={{height:3,background:'rgba(255,255,255,.05)',borderRadius:3,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct}%`,background:b.color, transition:'width 1.2s ease'}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─── REVEAL HOOK ─── */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }});
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

}
